name: Build libbpf for Android

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: 'Target ABI'
        required: true
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
        default: arm64-v8a
      api_level:
        description: 'Android API level'
        required: true
        default: '21'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "NDK_HOME=$PWD/android-ndk-r27c" >> $GITHUB_ENV

      - name: Compute toolchain vars
        run: |
          TOOLCHAIN=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64

          case "${{ inputs.target_arch }}" in
            arm64-v8a)   TRIPLE=aarch64-linux-android ;;
            armeabi-v7a) TRIPLE=armv7a-linux-androideabi ;;
            x86_64)      TRIPLE=x86_64-linux-android ;;
          esac

          echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV
          echo "TRIPLE=$TRIPLE"       >> $GITHUB_ENV
          echo "API=${{ inputs.api_level }}" >> $GITHUB_ENV
          echo "PREFIX=$PWD/install"  >> $GITHUB_ENV
          mkdir -p $PWD/install

      - name: Download sources
        run: |
          # zlib
          curl -sSL -o zlib.tar.gz https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar xf zlib.tar.gz

          # elfutils（提供 libelf）
          curl -sSL -o elfutils.tar.bz2 \
            https://sourceware.org/elfutils/ftp/0.191/elfutils-0.191.tar.bz2
          tar xf elfutils.tar.bz2

          # libbpf
          git clone --depth=1 --branch v1.4.3 https://github.com/libbpf/libbpf.git

      - name: Build zlib
        run: |
          cd zlib-1.3.1
          export CC=$TOOLCHAIN/bin/${TRIPLE}${API}-clang
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export CFLAGS="-fPIC -O2"
          ./configure --prefix=$PREFIX --static
          make -j$(nproc)
          make install

      - name: Build libelf
        run: |
          cd elfutils-0.191
          export CC=$TOOLCHAIN/bin/${TRIPLE}${API}-clang
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export CFLAGS="-fPIC -O2 -I$PREFIX/include"
          export LDFLAGS="-L$PREFIX/lib"
          export LIBS="-lz"

          ./configure \
            --host=$TRIPLE \
            --prefix=$PREFIX \
            --disable-demangler \
            --disable-debuginfod \
            --disable-libdebuginfod \
            --disable-nls \
            --without-zstd \
            --without-bzlib \
            --without-lzma \
            --disable-symbol-versioning \
            || (echo "=== config.log ===" && tail -150 config.log && exit 1)

          make -C libelf -j$(nproc)
          make -C libelf install

      - name: Build libbpf
        run: |
          cd libbpf/src
          export CC=$TOOLCHAIN/bin/${TRIPLE}${API}-clang
          export AR=$TOOLCHAIN/bin/llvm-ar
          export CFLAGS="-fPIC -O2 -I$PREFIX/include"
          export LDFLAGS="-L$PREFIX/lib"

          make -j$(nproc) \
            BUILD_STATIC_ONLY=y \
            PREFIX=$PREFIX \
            install

      - name: Stage artifacts
        run: |
          mkdir -p out/lib out/include

          # 找静态库（libbpf 默认装 lib64 或 lib，两个位置都探一下）
          find $PREFIX -name "libbpf.a" -o -name "libelf.a" -o -name "libz.a" \
            | xargs -I{} cp {} out/lib/

          # 头文件
          cp -r $PREFIX/include/bpf out/include/       2>/dev/null || true
          cp $PREFIX/include/libelf.h out/include/     2>/dev/null || true
          cp $PREFIX/include/gelf.h   out/include/     2>/dev/null || true
          cp $PREFIX/include/nlist.h  out/include/     2>/dev/null || true

          echo "=== 静态库 ==="
          ls -lh out/lib/
          echo "=== 头文件 ==="
          find out/include -maxdepth 2 -type f

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: libbpf-${{ inputs.target_arch }}-api${{ inputs.api_level }}
          path: out/
          if-no-files-found: error
